networks:
  cxxci:
    name: cxxci
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  teamcity_server_datadir:
  teamcity_server_logs:
  teamcity_agent_conf:

services:
  gitlab:
    image: gitlab/gitlab-ce:19.3.1-ce.0
    # Pinned rather than `:latest` — current stable at the time this was pinned (2026-08-28),
    # matching the exact-version convention already used for teamcity-server/teamcity-agent
    # below. `:latest` was never actually verified against a specific version; nothing here
    # relies on 19.3.1-ce.0 specifically, so bumping it later just needs a re-run of bootstrap.
    hostname: ${GITLAB_HOSTNAME:-gitlab.local}
    restart: unless-stopped
    shm_size: '256m'
    networks:
      cxxci:
        aliases:
          - ${GITLAB_HOSTNAME:-gitlab.local}
    ports:
      # 1:1 host:container mapping is required — NGINX listens on the port from external_url,
      # not on 80. See .scratch/teamcity-cxx-ci/research/gitlab-headless-bootstrap.md §2.
      - "${GITLAB_HTTP_PORT:-8929}:${GITLAB_HTTP_PORT:-8929}"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME:-gitlab.local}:${GITLAB_HTTP_PORT:-8929}'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD}'
        # Lets teamcity-server/teamcity-agent (on the cxxci network) poll /-/readiness and call
        # the API; default whitelist is 127.0.0.0/8 only. See research §5.
        gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '172.28.0.0/16']
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

  teamcity-server:
    image: jetbrains/teamcity-server:2026.1.3
    restart: unless-stopped
    networks:
      - cxxci
    ports:
      - "${TEAMCITY_HTTP_PORT:-8111}:8111"
    environment:
      TEAMCITY_SERVER_MEM_OPTS: "-Xmx2g -XX:ReservedCodeCacheSize=640m"
    volumes:
      - teamcity_server_datadir:/data/teamcity_server/datadir
      - teamcity_server_logs:/opt/teamcity/logs
    # NOTE: first start requires one manual browser step (data dir confirm, DB choice, accept
    # EULA, create admin account) — no headless equivalent exists in the current image. See
    # .scratch/teamcity-cxx-ci/research/teamcity-headless-bootstrap.md §1. After that, grab the
    # Super User token via: docker compose logs teamcity-server | grep "Super user authentication token:"

  teamcity-agent:
    image: jetbrains/teamcity-agent:2026.1.3
    restart: unless-stopped
    # Root is required so the mounted docker.sock is usable without host/container GID juggling
    # — this is JetBrains' own documented pattern, not a shortcut. See research §3.
    user: "0"
    networks:
      - cxxci
    environment:
      SERVER_URL: "http://teamcity-server:8111"
    volumes:
      - teamcity_agent_conf:/data/teamcity_agent/conf
      - /var/run/docker.sock:/var/run/docker.sock
      # MUST be host bind mounts, not named volumes: build steps run `docker run -v
      # %teamcity.build.checkoutDir%:/src ...` against the HOST's docker daemon (via the
      # socket above), so any path the agent passes as a mount source is resolved on the HOST
      # filesystem, not inside this container's namespace. A named volume here means the
      # /opt/buildagent/work path the agent thinks it's using doesn't exist on the host, so
      # TeamCity's Docker Wrapper feature would silently bind-mount an empty directory instead.
      # Confirmed empirically: `docker compose exec teamcity-agent touch
      # /opt/buildagent/work/probe/marker` did not appear on the host until this was switched
      # to bind mounts. Host-side paths must stay identical if more agents are ever added on
      # this host. See research §3 (ticket 01).
      #
      # Host-side base path is BUILDAGENT_DATA_DIR (.env, default /opt/buildagent) — the
      # container-side path stays /opt/buildagent regardless (that's what the agent software
      # itself expects). /opt/buildagent requires the docker daemon to own/create paths under
      # /opt, which a rootless Docker install or a non-root host account can't do — confirmed on
      # a second machine ("no permissions on /opt/buildagent"). Point BUILDAGENT_DATA_DIR at a
      # directory you actually own if that happens.
      - ${BUILDAGENT_DATA_DIR:-/opt/buildagent}/work:/opt/buildagent/work
      - ${BUILDAGENT_DATA_DIR:-/opt/buildagent}/temp:/opt/buildagent/temp
      - ${BUILDAGENT_DATA_DIR:-/opt/buildagent}/tools:/opt/buildagent/tools
      - ${BUILDAGENT_DATA_DIR:-/opt/buildagent}/plugins:/opt/buildagent/plugins
      - ${BUILDAGENT_DATA_DIR:-/opt/buildagent}/system:/opt/buildagent/system
    depends_on:
      - teamcity-server

  # One-shot provisioning tool, not part of `docker compose up`: run manually with
  # `docker compose run --rm bootstrap` once GitLab + TeamCity have settled (and the one
  # unavoidable manual TeamCity first-start step is done — see README). Runs attached to the
  # cxxci network directly instead of shelling out to sibling `docker run` containers for every
  # call — see ADR 0008.
  bootstrap:
    build:
      context: .
      dockerfile: scripts/bootstrap/Dockerfile
    profiles: ["tools"]
    networks:
      - cxxci
    environment:
      GITLAB_HTTP_PORT: ${GITLAB_HTTP_PORT:-8929}
    volumes:
      # Docker-outside-of-Docker, same pattern as teamcity-agent above: needed to exec into the
      # gitlab container (minting the root PAT) and read teamcity-server's logs (super user
      # token) — both require reaching into a sibling container, not just HTTP to it.
      - /var/run/docker.sock:/var/run/docker.sock
